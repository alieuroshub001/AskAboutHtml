<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Betting Intro</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap"
        rel="stylesheet">

    <style>
        .aag-sb-intro-section {
            font-family: 'Montserrat', sans-serif;
            background-color: #0b1120;
            box-sizing: border-box;
            line-height: 1.5;
        }

        .aag-sb-intro-section *,
        .aag-sb-intro-section *::before,
        .aag-sb-intro-section *::after {
            box-sizing: border-box;
        }

        .aag-sb-intro-container {
            max-width: 80rem;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
            text-align: center;
        }

        @media (min-width: 640px) {
            .aag-sb-intro-container {
                padding: 2.5rem 1.5rem;
            }
        }

        @media (min-width: 1024px) {
            .aag-sb-intro-container {
                padding: 2.5rem 2rem;
            }
        }

        .aag-sb-intro-text {
            font-size: 1.125rem !important;
            color: #d1d5dc !important;
            margin: 0;
            line-height: 1.6;
        }

        @media (min-width: 768px) {
            .aag-sb-intro-text {
                font-size: 1.25rem !important;
            }
        }
    </style>
</head>

<body>

    <section class="aag-sb-intro-section">
        <div class="aag-sb-intro-container">
            <p class="aag-sb-intro-text">
                See below for the top Sports Betting brands in Ontario! An unbias, objective review has been created for
                each brand with a specific criteria.
            </p>
        </div>
    </section>

</body>

</html>

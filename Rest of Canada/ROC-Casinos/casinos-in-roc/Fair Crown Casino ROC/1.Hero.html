<!DOCTYPE html>
<html lang="en">

<head>

        rel="stylesheet">

    <style>
        .aag-rccrev-hero-section {
            font-family: 'Montserrat', sans-serif;
            position: relative;
            display: flex;
            min-height: 60vh;
            align-items: center;
            overflow: hidden;
            padding-bottom: 4rem;
            padding-top: 7rem;
            box-sizing: border-box;
            line-height: 1.5;
        }

        .aag-rccrev-hero-section *,
        .aag-rccrev-hero-section *::before,
        .aag-rccrev-hero-section *::after {
            box-sizing: border-box;
        }

        .aag-rccrev-hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-size: cover;
            background-position: center;
            z-index: 0;
        }

        .aag-rccrev-hero-overlay-1 {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, #0b1120, rgba(11, 17, 32, 0.55), rgba(11, 17, 32, 0.1));
            z-index: 1;
        }

        .aag-rccrev-hero-overlay-2 {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to right, rgba(11, 17, 32, 0.4), transparent, transparent);
            z-index: 2;
        }

        .aag-rccrev-hero-content {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 80rem;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        @media (min-width: 640px) {
            .aag-rccrev-hero-content {
                padding: 0 1.5rem;
            }
        }

        @media (min-width: 1024px) {
            .aag-rccrev-hero-content {
                padding: 0 2rem;
            }
        }

        .aag-rccrev-hero-title {
            font-size: 2.25rem !important;
            font-weight: 800;
            letter-spacing: -0.025em;
            color: #ffffff !important;
            margin: 0;
            line-height: 1.2;
        }

        @media (min-width: 768px) {
            .aag-rccrev-hero-title {
                font-size: 3rem !important;
            }
        }

        @media (min-width: 1024px) {
            .aag-rccrev-hero-title {
                font-size: 3.75rem !important;
            }
        }

        .aag-rccrev-hero-nav {
            margin-top: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem !important;
            color: #94a3b8 !important;
        }

        .aag-rccrev-hero-nav a {
            color: inherit;
            text-decoration: underline;
            text-underline-offset: 2px;
            transition: color 0.3s ease;
        }

        .aag-rccrev-hero-nav a:hover {
            color: #ffffff !important;
        }

        .aag-rccrev-hero-nav svg {
            width: 0.75rem;
            height: 0.75rem;
        }

        .aag-rccrev-hero-nav span {
            font-weight: 500;
            color: #dc2626 !important;
        }
    </style>
</head>

<body>

    <section class="aag-rccrev-hero-section">
        <div class="aag-rccrev-hero-bg"
            style="background-image: url('https://askaboutgaming.ca/wp-content/uploads/2026/08/unrecognisable-casino-people-gambling-on-the-roule-2026-03-26-01-53-30-utc.jpg');">
        </div>
        <div class="aag-rccrev-hero-overlay-1"></div>
        <div class="aag-rccrev-hero-overlay-2"></div>

        <div class="aag-rccrev-hero-content">

            <nav class="aag-rccrev-hero-nav">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />

                </svg>

</body>

</html>
